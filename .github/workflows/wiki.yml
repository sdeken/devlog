name: Wiki

# Publishes wiki/ to the repository's GitHub wiki whenever it changes on main,
# so the wiki's pages are reviewed in pull requests like everything else.
# Pages deleted from wiki/ are deleted from the wiki too; edits made in the
# GitHub wiki UI are overwritten by the next publish.

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Copy the pages
        run: |
          find "$RUNNER_TEMP/wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. "$RUNNER_TEMP/wiki/"

      - name: Commit and push
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish wiki from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push origin HEAD
