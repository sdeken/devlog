appId: com.sdeken.devlog
productName: Devlog
directories:
  buildResources: build
  output: release
icon: build/icon.png
publish:
  provider: github
  owner: sdeken
  repo: devlog
  releaseType: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
win:
  target: [nsis]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage, deb]
  category: Office
npmRebuild: false
